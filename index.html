<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0e1621">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%232ea6ff'/%3E%3C/svg%3E">
  <meta name="description" content="Séance de musculation dans Telegram">
  <title>Séance</title>
  <link rel="stylesheet" href="./css/app.css?v=2">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app">
    <header>
      <div class="head-row">
        <h1 id="session-title">Séance</h1>
        <time id="stopwatch" datetime="PT0S">00:00</time>
      </div>
      <div class="progress-row">
        <span id="progress-label">0 / 0 séries</span>
        <span id="offline" class="offline" hidden>Hors ligne · tout est gardé sur le téléphone</span>
      </div>
      <div class="bar" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-labelledby="progress-label">
        <span id="progress-fill"></span>
      </div>
      <nav class="tools" aria-label="Outils">
        <button type="button" class="tool" data-open="week">📊 Semaine</button>
        <button type="button" class="tool" data-open="plates">🏋️ Disques</button>
        <button type="button" class="tool" data-open="settings" aria-label="Réglages">⚙️</button>
      </nav>
    </header>

    <p class="hint" id="hint">Touche une série pour la valider. Appui long ou ✎ pour corriger. 📈 pour l’historique.</p>
    <main id="exercise-list"></main>
    <footer id="footer">
      <button id="finish-btn" class="btn primary block" type="button">🏁 Terminer</button>
    </footer>

    <section id="end-screen" hidden aria-labelledby="end-title">
      <h2 id="end-title" tabindex="-1">Séance terminée</h2>
      <div id="end-stats" class="stats"></div>
      <div id="end-prs"></div>
      <label class="comment-field">
        <span>Commentaire <em class="muted">optionnel</em></span>
        <textarea id="session-comment" rows="4" maxlength="2000" autocomplete="off" aria-describedby="end-help" placeholder="Ton ressenti…"></textarea>
      </label>
      <p id="end-help" class="muted small">Facilité, forme, fatigue, séries sautées et pourquoi.</p>
      <button id="send-session" class="btn primary block" type="button">Envoyer</button>
    </section>
  </div>

  <div id="rest-bar" role="region" aria-label="Repos" hidden>
    <div id="rest-progress" aria-hidden="true"><span id="rest-progress-fill"></span></div>
    <div class="rest-inner">
      <div class="rest-main">
        <div class="rest-text">
          <span id="rest-label">Repos</span>
          <strong id="rest-time">0:00</strong>
        </div>
        <div class="rest-actions">
          <button type="button" id="rest-minus" aria-label="Retirer 15 secondes">−15</button>
          <button type="button" id="rest-plus" aria-label="Ajouter 15 secondes">+15</button>
          <button type="button" id="rest-skip">Passer</button>
        </div>
      </div>
      <div class="feel-row" id="feel-row">
        <span class="feel-q" id="feel-q">Ressenti ?</span>
        <div class="feel-btns" role="group" aria-labelledby="feel-q">
          <button type="button" class="feel" data-feel="1">😌 Facile</button>
          <button type="button" class="feel" data-feel="2">🙂 OK</button>
          <button type="button" class="feel" data-feel="3">🥵 Dur</button>
        </div>
      </div>
    </div>
  </div>

  <div id="hold-bar" role="timer" aria-label="Chrono du maintien" hidden>
    <div id="hold-progress" aria-hidden="true"><span id="hold-progress-fill"></span></div>
    <div class="hold-inner">
      <div class="hold-text">
        <span id="hold-label">Prépare-toi</span>
        <strong id="hold-time">3</strong>
      </div>
      <button type="button" id="hold-cancel">Annuler</button>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <!-- Set editor: a bottom sheet with steppers, so the keyboard is optional -->
  <dialog id="dlg-edit" class="sheet" aria-labelledby="edit-title"></dialog>
  <dialog id="dlg-history" class="sheet tall" aria-labelledby="hist-title"></dialog>
  <dialog id="dlg-week" class="sheet tall" aria-labelledby="week-title"></dialog>
  <dialog id="dlg-plates" class="sheet" aria-labelledby="plates-title"></dialog>
  <dialog id="dlg-settings" class="sheet tall" aria-labelledby="settings-title"></dialog>
  <dialog id="dlg-anim" class="sheet" aria-labelledby="anim-title"></dialog>
  <dialog id="dlg-summary" class="sheet tall" aria-labelledby="summary-title"></dialog>

  <p id="live" class="sr-only" aria-live="polite"></p>
  <noscript>Active JavaScript pour suivre la séance.</noscript>
  <script type="module" src="./js/app.js?v=2"></script>
</body>
</html>
