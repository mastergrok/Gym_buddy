<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1621">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%232ea6ff'/%3E%3C/svg%3E">
  <meta name="description" content="Séance de musculation dans Telegram">
  <title>Séance</title>
  <!-- gym-buddy -->
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0e1621);
      --text: var(--tg-theme-text-color, #f2f6fb);
      --hint: var(--tg-theme-hint-color, #8b9bb0);
      --link: var(--tg-theme-link-color, #6bc2ff);
      --btn: var(--tg-theme-button-color, #2ea6ff);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --secondary: var(--tg-theme-secondary-bg-color, #232e3c);
      --header: var(--tg-theme-header-bg-color, #0e1621);
      --section: var(--tg-theme-section-bg-color, #17212b);
      --accent: var(--tg-theme-accent-text-color, #6bc2ff);
      --destructive: var(--tg-theme-destructive-text-color, #ff5d6c);
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.35;
      padding-bottom: env(safe-area-inset-bottom);
    }

    body.rest-on { padding-bottom: calc(148px + env(safe-area-inset-bottom)); }

    button, input { font: inherit; color: inherit; }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--btn);
      outline-offset: 2px;
    }

    .app { max-width: 640px; margin: 0 auto; }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--header);
      padding: calc(14px + env(safe-area-inset-top)) 16px 12px;
      border-bottom: 1px solid color-mix(in srgb, var(--text) 10%, transparent);
    }

    .head-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    #stopwatch {
      flex: none;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.02em;
      background: var(--secondary);
      color: var(--text);
      border-radius: 999px;
      padding: 6px 12px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 10px;
    }

    #progress-label {
      color: var(--hint);
      font-size: 0.92rem;
      font-variant-numeric: tabular-nums;
    }

    .bar {
      margin-top: 8px;
      height: 6px;
      border-radius: 99px;
      background: var(--secondary);
      overflow: hidden;
    }

    #progress-fill {
      display: block;
      height: 100%;
      width: 0;
      background: var(--btn);
      border-radius: inherit;
    }

    .hint {
      margin: 12px 16px 4px;
      color: var(--hint);
      font-size: 0.88rem;
    }

    main { padding: 8px 16px 4px; }

    .exercise {
      background: var(--section);
      border-radius: 16px;
      padding: 14px;
      margin: 0 0 12px;
    }

    .exercise.resting { box-shadow: inset 3px 0 0 var(--btn); }
    .exercise.complete:not(.resting) { box-shadow: inset 3px 0 0 #3ddc97; }

    .ex-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
    }

    .exercise h2 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: -0.01em;
      overflow-wrap: anywhere;
    }

    .ex-count {
      flex: none;
      color: var(--hint);
      font-variant-numeric: tabular-nums;
      font-size: 0.92rem;
    }

    .target, .rest-hint { margin: 4px 0 0; }

    .target {
      color: var(--text);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    .rest-hint {
      color: var(--hint);
      font-size: 0.85rem;
      margin-bottom: 10px;
    }

    .sets {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(4.6rem, 1fr));
      gap: 8px;
    }

    .set-wrap { position: relative; }

    .set {
      width: 100%;
      min-height: 76px;
      scroll-margin-top: 130px;
      padding: 22px 4px 8px;
      border-radius: 14px;
      border: 1px solid color-mix(in srgb, var(--text) 12%, transparent);
      background: var(--secondary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      user-select: none;
      touch-action: manipulation;
    }

    .set[aria-pressed="true"] {
      border-color: var(--btn);
      background: color-mix(in srgb, var(--btn) 22%, var(--secondary));
    }

    .set-mark {
      position: absolute;
      top: 4px;
      left: 6px;
      font-size: 13px;
      line-height: 1;
    }

    .set-n {
      font-size: 1.15rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .set-actual {
      font-size: 11px;
      color: var(--hint);
      font-variant-numeric: tabular-nums;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .edit {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--hint);
      font-size: 14px;
      line-height: 1;
      z-index: 1;
    }

    .editor {
      margin-top: 10px;
      padding: 10px;
      border-radius: 12px;
      background: var(--bg);
      scroll-margin-top: 88px;
      scroll-margin-bottom: 140px;
    }

    .editor-title {
      margin: 0 0 8px;
      font-weight: 650;
    }

    .editor-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .editor label {
      display: grid;
      gap: 4px;
      font-size: 0.82rem;
      color: var(--hint);
    }

    .editor input {
      width: 100%;
      font-size: 16px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid color-mix(in srgb, var(--text) 18%, transparent);
      background: var(--section);
      color: var(--text);
    }

    .editor-error {
      color: var(--destructive);
      margin: 8px 0 0;
      font-size: 0.85rem;
    }

    .editor-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .editor-actions button {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      border: 0;
      font-weight: 650;
    }

    .editor-save { background: var(--btn); color: var(--btn-text); }

    .editor-cancel {
      background: transparent;
      color: var(--text);
      border: 1px solid color-mix(in srgb, var(--text) 18%, transparent);
    }

    footer { padding: 4px 16px 24px; }

    #finish-btn {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px 16px;
      background: var(--btn);
      color: var(--btn-text);
      font-weight: 700;
      font-size: 1.05rem;
      scroll-margin-bottom: 160px;
    }

    #finish-btn:active { transform: scale(0.99); }

    #rest-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 6;
      background: var(--secondary);
      border-top: 1px solid color-mix(in srgb, var(--text) 12%, transparent);
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.18);
    }

    #rest-bar[hidden] { display: none !important; }

    #rest-progress { height: 3px; background: color-mix(in srgb, var(--text) 12%, transparent); }
    #rest-progress-fill { display: block; height: 100%; width: 100%; background: var(--btn); }

    .rest-inner {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    }

    .rest-text { min-width: 0; }

    #rest-label {
      display: block;
      color: var(--hint);
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 42vw;
    }

    #rest-time {
      font-size: 1.35rem;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
    }

    .rest-actions { display: flex; gap: 6px; margin-left: auto; flex: none; }

    #rest-bar.is-done .rest-actions { display: none; }

    .rest-actions button {
      border: 0;
      border-radius: 999px;
      padding: 8px 12px;
      background: var(--bg);
      color: var(--text);
      font-weight: 650;
    }

    #rest-skip { color: var(--destructive); }

    #summary {
      width: min(520px, calc(100vw - 24px));
      max-height: min(90vh, 720px);
      border: 0;
      border-radius: 16px;
      padding: 16px;
      background: var(--section);
      color: var(--text);
    }

    #summary[open] {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #summary::backdrop { background: rgba(0, 0, 0, 0.55); }

    #summary h2 { margin: 0; font-size: 1.15rem; }

    #summary p { margin: 0; color: var(--hint); font-size: 0.9rem; }

    #summary-json {
      margin: 0;
      max-height: 42vh;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 12px;
      line-height: 1.4;
      background: var(--bg);
      color: var(--text);
      padding: 10px;
      border-radius: 10px;
    }

    .summary-actions { display: flex; gap: 8px; }

    .summary-actions button {
      flex: 1;
      border: 0;
      border-radius: 12px;
      padding: 12px;
      font-weight: 700;
    }

    #summary-copy { background: var(--btn); color: var(--btn-text); }
    #summary-close { background: var(--bg); color: var(--text); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 420px) {
      .editor-fields { grid-template-columns: 1fr; }
      .rest-actions { width: 100%; margin-left: 0; }
      .rest-actions button { flex: 1; padding: 8px 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="head-row">
        <h1 id="session-title">Séance</h1>
        <time id="stopwatch" datetime="PT0S">00:00</time>
      </div>
      <div class="progress-row">
        <span id="progress-label">0 / 0 séries</span>
      </div>
      <div class="bar" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-labelledby="progress-label">
        <span id="progress-fill"></span>
      </div>
    </header>
    <p class="hint" id="hint">Touchez une série pour la valider. Maintenez ou touchez ✎ pour corriger.</p>
    <main id="exercise-list"></main>
    <footer>
      <button id="finish-btn" type="button">🏁 Terminer</button>
    </footer>
  </div>

  <div id="rest-bar" role="region" aria-label="Repos" hidden>
    <div id="rest-progress" aria-hidden="true"><span id="rest-progress-fill"></span></div>
    <div class="rest-inner">
      <div class="rest-text">
        <span id="rest-label">Repos</span>
        <strong id="rest-time">0:00</strong>
      </div>
      <div class="rest-actions">
        <button type="button" id="rest-plus" aria-label="Ajouter 15 secondes">+15 s</button>
        <button type="button" id="rest-minus" aria-label="Retirer 15 secondes">−15 s</button>
        <button type="button" id="rest-skip">Passer</button>
      </div>
    </div>
  </div>

  <dialog id="summary" aria-labelledby="summary-title">
    <h2 id="summary-title">Résumé de la séance</h2>
    <p id="summary-help">sendData n'est disponible que depuis le bouton web_app du clavier Telegram. Copie le JSON pour l'envoyer au bot.</p>
    <p id="summary-note" hidden>Clés raccourcies pour rester sous 4096 octets.</p>
    <pre id="summary-json" translate="no"></pre>
    <p id="summary-size"></p>
    <div class="summary-actions">
      <button type="button" id="summary-copy">Copier</button>
      <button type="button" id="summary-close">Fermer</button>
    </div>
  </dialog>
  <p id="live" class="sr-only" aria-live="polite"></p>
  <noscript>Activez JavaScript pour suivre la séance.</noscript>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
(function () {
  'use strict';

  var DEFAULT_PROGRAMME = {
    title: 'Séance',
    exercises: [
      { name: 'Développé couché barre', sets: 4, reps: 10, weight: 60, unit: 'kg', rest: 120 },
      { name: 'Dips', sets: 4, reps: 10, rest: 90 },
      { name: 'Développé militaire haltères', sets: 3, reps: 12, weight: 17.5, unit: 'kg par bras', rest: 90 },
      { name: 'Élévations latérales haltères', sets: 3, reps: 12, weight: 10, unit: 'kg', rest: 60 },
      { name: 'Pike push-ups', sets: 3, reps: 10, rest: 60 },
      { name: 'L-sit', sets: 4, seconds: 15, rest: 60 },
      { name: 'ATR libre', sets: 5, seconds: 10, rest: 60 }
    ]
  };

  var tg = (window.Telegram && window.Telegram.WebApp) || null;
  var programme = loadProgramme();
  var CANON = canonical(programme);
  var storageKey = 'gymbuddy:v1:' + hash32(CANON);

  var started = Date.now();
  var cells = programme.exercises.map(blankRow);
  var restRunning = false;
  var restUntil = 0;
  var restTotal = 0;
  var restIndex = -1;
  var restTick = 0;
  var hideTimer = 0;
  var editAt = null;
  var armClickSwallow = false;
  var swallowClick = false;
  var sealed = false;
  var lastJson = null;
  var lastShort = false;
  var audioCtx = null;
  var lastClock = -1;

  var list = document.getElementById('exercise-list');
  var finishBtn = document.getElementById('finish-btn');

  function loadProgramme() {
    var params;
    try { params = new URLSearchParams(location.search); }
    catch (e) { return clone(DEFAULT_PROGRAMME); }
    var decoded = decodeParam(params.get('p'));
    return decoded || clone(DEFAULT_PROGRAMME);
  }

  function clone(obj) {
    return JSON.parse(JSON.stringify(obj));
  }

  function decodeParam(p) {
    if (!p) return null;
    try {
      var s = String(p).trim().replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      var bin = atob(s);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var json = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
      return normalizeProgramme(JSON.parse(json));
    } catch (e) {
      return null;
    }
  }

  function normalizeProgramme(raw) {
    if (!raw || typeof raw !== 'object' || !Array.isArray(raw.exercises)) return null;
    var exercises = [];
    for (var i = 0; i < raw.exercises.length; i++) {
      var ex = normalizeExercise(raw.exercises[i]);
      if (ex) exercises.push(ex);
    }
    if (!exercises.length) return null;
    var title = typeof raw.title === 'string' ? raw.title.trim() : '';
    if (!title) title = 'Séance';
    if (title.length > 120) title = title.slice(0, 120);
    return { title: title, exercises: exercises };
  }

  function normalizeExercise(raw) {
    if (!raw || typeof raw !== 'object') return null;
    var name = typeof raw.name === 'string' ? raw.name.trim() : '';
    if (!name) return null;
    var sets = Math.round(Number(raw.sets));
    if (!isFinite(sets) || sets < 1 || sets > 100) return null;
    var seconds = null;
    var reps = null;
    if (raw.seconds != null && raw.seconds !== '') {
      seconds = Number(raw.seconds);
      if (!isFinite(seconds) || seconds < 0) return null;
    } else if (raw.reps != null && raw.reps !== '') {
      reps = Number(raw.reps);
      if (!isFinite(reps) || reps < 0) return null;
    } else {
      return null;
    }
    var weight = null;
    if (raw.weight != null && raw.weight !== '') {
      weight = Number(raw.weight);
      if (!isFinite(weight) || weight < 0) return null;
    }
    var unit = null;
    if (typeof raw.unit === 'string' && raw.unit.trim()) unit = raw.unit.trim();
    else if (weight != null) unit = 'kg';
    var rest = Number(raw.rest);
    if (!isFinite(rest) || rest < 0) rest = 60;
    rest = Math.round(rest);
    var ex = { name: name, sets: sets, rest: rest };
    if (seconds != null) ex.seconds = round3(seconds);
    else ex.reps = round3(reps);
    if (weight != null) {
      ex.weight = round3(weight);
      ex.unit = unit || 'kg';
    }
    return ex;
  }

  function canonical(prog) {
    return JSON.stringify({
      title: prog.title,
      exercises: prog.exercises.map(function (ex) {
        var o = { name: ex.name, sets: ex.sets, rest: ex.rest };
        if (ex.seconds != null) o.seconds = ex.seconds;
        else o.reps = ex.reps;
        if (ex.weight != null) {
          o.weight = ex.weight;
          o.unit = ex.unit || 'kg';
        }
        return o;
      })
    });
  }

  function hash32(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return (h >>> 0).toString(16).padStart(8, '0');
  }

  function blankRow(ex) {
    var row = [];
    for (var s = 0; s < ex.sets; s++) row.push(blankCell(ex));
    return row;
  }

  function blankCell(ex) {
    return {
      done: false,
      reps: ex.reps != null ? ex.reps : null,
      seconds: ex.seconds != null ? ex.seconds : null,
      weight: ex.weight != null ? ex.weight : null
    };
  }

  function round3(n) {
    return Math.round(Number(n) * 1000) / 1000;
  }

  function fmtNum(n) {
    if (!isFinite(Number(n))) return '0';
    return String(round3(n));
  }

  function formatTarget(ex) {
    var effort = ex.seconds != null ? (fmtNum(ex.seconds) + ' s') : fmtNum(ex.reps);
    var text = ex.sets + ' × ' + effort;
    if (ex.weight != null) text += ' · ' + fmtNum(ex.weight) + ' ' + (ex.unit || 'kg');
    return text;
  }

  function formatActual(cell, ex) {
    if (ex.seconds != null) return fmtNum(cell.seconds) + ' s';
    var text = fmtNum(cell.reps);
    if (cell.weight != null) text += ' · ' + fmtNum(cell.weight);
    return text;
  }

  function differs(cell, ex) {
    if (ex.seconds != null) {
      if (cell.seconds !== ex.seconds) return true;
    } else if (cell.reps !== ex.reps) return true;
    var targetWeight = ex.weight != null ? ex.weight : null;
    return cell.weight !== targetWeight;
  }

  function seriesWord(n) {
    return n === 1 ? 'série' : 'séries';
  }

  function counts() {
    var done = 0;
    var total = 0;
    cells.forEach(function (row) {
      row.forEach(function (cell) {
        total += 1;
        if (cell.done) done += 1;
      });
    });
    return { done: done, total: total };
  }

  function allDone() {
    return cells.every(function (row) { return row.every(function (cell) { return cell.done; }); });
  }

  function storageGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function storageSet(key, value) {
    try { localStorage.setItem(key, value); } catch (e) {}
  }
  function storageDel(key) {
    try { localStorage.removeItem(key); } catch (e) {}
  }

  function save() {
    if (sealed) return;
    storageSet(storageKey, JSON.stringify({
      v: 1,
      canon: CANON,
      started: started,
      restUntil: restRunning ? restUntil : 0,
      restTotal: restRunning ? restTotal : 0,
      restIndex: restRunning ? restIndex : -1,
      restRunning: !!restRunning,
      cells: cells
    }));
  }

  function restore() {
    var raw = storageGet(storageKey);
    if (!raw) return;
    try {
      var data = JSON.parse(raw);
      if (!data || data.v !== 1 || data.canon !== CANON) return;
      if (!Array.isArray(data.cells) || data.cells.length !== programme.exercises.length) return;
      var next = [];
      for (var i = 0; i < programme.exercises.length; i++) {
        var ex = programme.exercises[i];
        if (!Array.isArray(data.cells[i]) || data.cells[i].length !== ex.sets) return;
        next.push(data.cells[i].map(function (cell) { return sanitizeCell(cell, ex); }));
      }
      cells = next;
      if (typeof data.started === 'number' && data.started > 0 && data.started <= Date.now() + 2000) {
        started = data.started;
      }
      if (data.restRunning && typeof data.restUntil === 'number' && data.restUntil > Date.now()) {
        restRunning = true;
        restUntil = data.restUntil;
        restTotal = typeof data.restTotal === 'number' && data.restTotal > 0 ? data.restTotal : (data.restUntil - Date.now());
        restIndex = typeof data.restIndex === 'number' ? data.restIndex : -1;
      }
    } catch (e) {}
  }

  function sanitizeCell(cell, ex) {
    var base = blankCell(ex);
    if (!cell || typeof cell !== 'object') return base;
    base.done = !!cell.done;
    if (ex.seconds != null && cell.seconds != null && isFinite(Number(cell.seconds))) {
      base.seconds = round3(cell.seconds);
    }
    if (ex.reps != null && cell.reps != null && isFinite(Number(cell.reps))) {
      base.reps = round3(cell.reps);
    }
    if (Object.prototype.hasOwnProperty.call(cell, 'weight')) {
      if (cell.weight == null || cell.weight === '') base.weight = null;
      else if (isFinite(Number(cell.weight)) && Number(cell.weight) >= 0) base.weight = round3(cell.weight);
    }
    return base;
  }

  function renderAll() {
    renderHeader();
    renderExercises();
    renderRest();
  }

  function renderHeader() {
    var title = document.getElementById('session-title');
    title.textContent = programme.title;
    document.title = programme.title;
    var c = counts();
    var label = document.getElementById('progress-label');
    label.textContent = c.done + ' / ' + c.total + ' ' + seriesWord(c.total);
    var faite = c.done === 1 ? 'faite' : 'faites';
    label.setAttribute('aria-label', c.done + ' ' + seriesWord(c.done) + ' ' + faite + ' sur ' + c.total);
    var bar = document.getElementById('progress');
    bar.setAttribute('aria-valuemax', String(c.total));
    bar.setAttribute('aria-valuenow', String(c.done));
    document.getElementById('progress-fill').style.width = c.total ? ((c.done / c.total) * 100) + '%' : '0%';
  }

  function renderExercises() {
    list.replaceChildren();
    programme.exercises.forEach(function (ex, i) {
      var doneCount = cells[i].filter(function (cell) { return cell.done; }).length;
      var card = document.createElement('article');
      card.className = 'exercise';
      card.dataset.i = String(i);
      if (doneCount === ex.sets) card.classList.add('complete');
      if (restRunning && restIndex === i) card.classList.add('resting');

      var head = document.createElement('div');
      head.className = 'ex-head';
      var h2 = document.createElement('h2');
      h2.textContent = ex.name;
      var count = document.createElement('span');
      count.className = 'ex-count';
      count.textContent = doneCount + ' / ' + ex.sets;
      head.append(h2, count);

      var target = document.createElement('p');
      target.className = 'target';
      target.textContent = formatTarget(ex);

      var rest = document.createElement('p');
      rest.className = 'rest-hint';
      rest.textContent = 'Repos ' + ex.rest + ' s';

      var sets = document.createElement('div');
      sets.className = 'sets';
      for (var s = 0; s < ex.sets; s++) sets.append(renderSet(ex, i, s));

      card.append(head, target, rest, sets);
      if (editAt && editAt.i === i) card.append(renderEditor(ex, editAt.s));
      list.append(card);
    });
    if (editAt) {
      var input = document.getElementById('editor-value');
      if (input) {
        try { input.focus({ preventScroll: true }); } catch (e) { input.focus(); }
        input.select();
        setTimeout(function () {
          var editor = document.getElementById('editor');
          if (editor && editAt) editor.scrollIntoView({ block: 'nearest' });
        }, 600);
      }
    }
  }

  function renderSet(ex, i, s) {
    var cell = cells[i][s];
    var wrap = document.createElement('div');
    wrap.className = 'set-wrap';

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'set';
    btn.dataset.i = String(i);
    btn.dataset.s = String(s);
    btn.setAttribute('aria-pressed', cell.done ? 'true' : 'false');
    btn.setAttribute('aria-label', 'Série ' + (s + 1) + ' sur ' + ex.sets + ', ' + (cell.done ? 'faite' : 'non faite'));

    if (cell.done) {
      var mark = document.createElement('span');
      mark.className = 'set-mark';
      mark.setAttribute('aria-hidden', 'true');
      mark.textContent = '✅';
      btn.append(mark);
    }

    var num = document.createElement('span');
    num.className = 'set-n';
    num.textContent = String(s + 1);
    btn.append(num);

    if (cell.done || differs(cell, ex)) {
      var actual = document.createElement('span');
      actual.className = 'set-actual';
      actual.textContent = formatActual(cell, ex);
      btn.append(actual);
    }

    var edit = document.createElement('button');
    edit.type = 'button';
    edit.className = 'edit';
    edit.dataset.i = String(i);
    edit.dataset.s = String(s);
    edit.setAttribute('aria-label', 'Modifier la série ' + (s + 1) + ' de ' + ex.name);
    edit.textContent = '✎';

    wrap.append(btn, edit);
    return wrap;
  }

  function renderEditor(ex, s) {
    var cell = cells[exIndex(ex)][s];
    var box = document.createElement('div');
    box.id = 'editor';
    box.className = 'editor';
    box.setAttribute('role', 'group');
    box.setAttribute('aria-label', 'Modifier la série ' + (s + 1));

    var title = document.createElement('p');
    title.className = 'editor-title';
    title.textContent = 'Série ' + (s + 1);

    var fields = document.createElement('div');
    fields.className = 'editor-fields';

    var valueLabel = document.createElement('label');
    var valueName = document.createElement('span');
    valueName.textContent = ex.seconds != null ? 'Secondes' : 'Répétitions';
    var valueInput = document.createElement('input');
    valueInput.id = 'editor-value';
    valueInput.inputMode = 'decimal';
    valueInput.autocomplete = 'off';
    valueInput.maxLength = 8;
    valueInput.value = ex.seconds != null ? fmtNum(cell.seconds) : fmtNum(cell.reps);
    valueLabel.append(valueName, valueInput);

    var weightLabel = document.createElement('label');
    var weightName = document.createElement('span');
    weightName.textContent = 'Poids (' + (ex.unit || 'kg') + ')';
    var weightInput = document.createElement('input');
    weightInput.id = 'editor-weight';
    weightInput.inputMode = 'decimal';
    weightInput.autocomplete = 'off';
    weightInput.maxLength = 8;
    if (cell.weight != null) weightInput.value = fmtNum(cell.weight);
    else weightInput.placeholder = 'optionnel';
    weightLabel.append(weightName, weightInput);

    fields.append(valueLabel, weightLabel);

    var err = document.createElement('p');
    err.id = 'editor-error';
    err.className = 'editor-error';
    err.hidden = true;

    var actions = document.createElement('div');
    actions.className = 'editor-actions';
    var saveBtn = document.createElement('button');
    saveBtn.type = 'button';
    saveBtn.className = 'editor-save';
    saveBtn.dataset.action = 'save-edit';
    saveBtn.textContent = 'Enregistrer';
    var cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'editor-cancel';
    cancelBtn.dataset.action = 'cancel-edit';
    cancelBtn.textContent = 'Annuler';
    actions.append(saveBtn, cancelBtn);

    box.append(title, fields, err, actions);
    return box;
  }

  function exIndex(ex) {
    return programme.exercises.indexOf(ex);
  }

  function renderRest() {
    var bar = document.getElementById('rest-bar');
    if (!restRunning) {
      if (!bar.classList.contains('is-done')) hideRest();
      return;
    }
    bar.hidden = false;
    bar.classList.remove('is-done');
    document.body.classList.add('rest-on');
    var ex = programme.exercises[restIndex];
    document.getElementById('rest-label').textContent = ex ? ('Repos · ' + ex.name) : 'Repos';
    var left = Math.max(0, restUntil - Date.now());
    document.getElementById('rest-time').textContent = fmtRest(left);
    var total = restTotal || left || 1;
    var pct = Math.max(0, Math.min(100, (left / total) * 100));
    document.getElementById('rest-progress-fill').style.width = pct + '%';
    syncRestingClass();
  }

  function syncRestingClass() {
    var cards = document.querySelectorAll('.exercise');
    for (var i = 0; i < cards.length; i++) {
      cards[i].classList.toggle('resting', restRunning && Number(cards[i].dataset.i) === restIndex);
    }
  }

  function hideRest() {
    var bar = document.getElementById('rest-bar');
    bar.hidden = true;
    bar.classList.remove('is-done');
    document.body.classList.remove('rest-on');
  }

  function fmtRest(ms) {
    var s = Math.max(0, Math.ceil(ms / 1000));
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return m + ':' + String(sec).padStart(2, '0');
  }

  function fmtClock(sec) {
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    var s = sec % 60;
    var p = function (n) { return String(n).padStart(2, '0'); };
    if (h > 0) return h + ':' + p(m) + ':' + p(s);
    return p(m) + ':' + p(s);
  }

  function tickClock() {
    var sec = Math.max(0, Math.floor((Date.now() - started) / 1000));
    if (sec === lastClock) return;
    lastClock = sec;
    var text = fmtClock(sec);
    var node = document.getElementById('stopwatch');
    node.textContent = text;
    node.setAttribute('aria-label', 'Durée de la séance : ' + text);
    node.setAttribute('datetime', clockDuration(sec));
  }

  function clockDuration(sec) {
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    var s = sec % 60;
    return 'PT' + h + 'H' + m + 'M' + s + 'S';
  }

  function startRest(i) {
    primeAudio();
    restIndex = i;
    restTotal = programme.exercises[i].rest * 1000;
    restUntil = Date.now() + restTotal;
    restRunning = true;
    clearTimeout(hideTimer);
    save();
    renderRest();
    announce('Repos ' + programme.exercises[i].rest + ' secondes');
    if (!restTick) restTick = setInterval(tickRest, 200);
  }

  function tickRest() {
    if (!restRunning) return;
    if (restUntil - Date.now() <= 0) {
      completeRest();
      return;
    }
    renderRest();
  }

  function completeRest() {
    if (!restRunning) return;
    restRunning = false;
    restUntil = 0;
    syncRestingClass();
    if (sealed) {
      hideRest();
      return;
    }
    save();
    var bar = document.getElementById('rest-bar');
    bar.hidden = false;
    bar.classList.add('is-done');
    document.body.classList.add('rest-on');
    document.getElementById('rest-label').textContent = 'Repos terminé';
    document.getElementById('rest-time').textContent = '0:00';
    document.getElementById('rest-progress-fill').style.width = '0%';
    hapticSuccess();
    beep();
    announce('Repos terminé');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () {
      if (!restRunning) hideRest();
    }, 1300);
  }

  function adjustRest(delta) {
    if (!restRunning) return;
    primeAudio();
    restUntil += delta;
    restTotal = Math.max(1000, (restTotal || 0) + delta);
    if (restUntil <= Date.now()) {
      completeRest();
      return;
    }
    save();
    renderRest();
  }

  function skipRest() {
    if (!restRunning) return;
    restRunning = false;
    restUntil = 0;
    clearTimeout(hideTimer);
    save();
    hideRest();
    syncRestingClass();
  }

  function toggleSet(i, s) {
    if (sealed) return;
    if (!cells[i] || !cells[i][s]) return;
    var cell = cells[i][s];
    var was = cell.done;
    cell.done = !cell.done;
    if (editAt && editAt.i === i && editAt.s === s) editAt = null;
    if (cell.done && !was) {
      primeAudio();
      if (!allDone() && programme.exercises[i].rest > 0) startRest(i);
      else {
        restRunning = false;
        restUntil = 0;
        clearTimeout(hideTimer);
      }
    }
    save();
    renderAll();
  }

  function openEdit(i, s) {
    if (sealed) return;
    editAt = { i: i, s: s };
    renderExercises();
  }

  function parseNum(str) {
    if (str == null) return null;
    var s = String(str).trim().replace(/\s/g, '').replace(',', '.');
    if (!s) return null;
    var n = Number(s);
    if (!isFinite(n)) return null;
    return round3(n);
  }

  function commitEdit() {
    if (!editAt || sealed) return;
    var ex = programme.exercises[editAt.i];
    var valueEl = document.getElementById('editor-value');
    var weightEl = document.getElementById('editor-weight');
    var err = document.getElementById('editor-error');
    var value = parseNum(valueEl.value);
    var weightRaw = weightEl.value.trim();
    var weight = weightRaw === '' ? null : parseNum(weightRaw);
    if (value == null || value < 0 || (weightRaw !== '' && (weight == null || weight < 0))) {
      err.hidden = false;
      err.textContent = 'Nombre invalide';
      return;
    }
    var cell = cells[editAt.i][editAt.s];
    if (ex.seconds != null) cell.seconds = value;
    else cell.reps = value;
    cell.weight = weight;
    editAt = null;
    save();
    renderExercises();
    renderHeader();
  }

  function utf8len(s) {
    if (window.TextEncoder) return new TextEncoder().encode(s).length;
    return unescape(encodeURIComponent(s)).length;
  }

  function buildRaw() {
    return {
      type: 'gym_session',
      title: programme.title,
      started: new Date(started).toISOString(),
      duration_s: Math.max(0, Math.round((Date.now() - started) / 1000)),
      exercises: programme.exercises.map(function (ex, i) {
        return {
          name: ex.name,
          target: formatTarget(ex),
          sets: cells[i].map(function (cell) {
            var set = { done: !!cell.done };
            if (ex.seconds != null) set.seconds = round3(cell.seconds);
            else set.reps = round3(cell.reps);
            if (cell.weight != null) set.weight = round3(cell.weight);
            return set;
          })
        };
      })
    };
  }

  function packShortSet(set) {
    var o = { ok: set.done ? 1 : 0 };
    if (set.seconds != null) o.sec = set.seconds;
    else o.r = set.reps;
    if (set.weight != null) o.w = set.weight;
    return o;
  }

  function toShort(raw, withTarget) {
    return {
      t: 'gym_session',
      n: raw.title,
      s: raw.started,
      d: raw.duration_s,
      e: raw.exercises.map(function (ex) {
        var item = { n: ex.name };
        if (withTarget) item.g = ex.target;
        item.s = ex.sets.map(packShortSet);
        return item;
      })
    };
  }

  function fitShort(raw) {
    var clone = JSON.parse(JSON.stringify(raw));
    var guard = 0;
    function packed() { return JSON.stringify(toShort(clone, false)); }
    while (utf8len(packed()) > 4096 && guard < 10000) {
      guard += 1;
      var removed = false;
      for (var i = clone.exercises.length - 1; i >= 0; i--) {
        if (clone.exercises[i].sets.length) {
          clone.exercises[i].sets.pop();
          removed = true;
          if (!clone.exercises[i].sets.length) clone.exercises.splice(i, 1);
          break;
        }
      }
      if (!removed) break;
    }
    var obj = toShort(clone, false);
    var json = JSON.stringify(obj);
    if (utf8len(json) > 4096) {
      obj.n = String(obj.n || '').slice(0, 40);
      json = JSON.stringify(obj);
    }
    while (utf8len(json) > 4096 && obj.e.length) {
      obj.e.pop();
      json = JSON.stringify(obj);
    }
    return json;
  }

  function encodePayload(raw) {
    var full = JSON.stringify(raw);
    if (utf8len(full) <= 4096) return { json: full, short: false };
    var withTarget = JSON.stringify(toShort(raw, true));
    if (utf8len(withTarget) <= 4096) return { json: withTarget, short: true };
    var bare = JSON.stringify(toShort(raw, false));
    if (utf8len(bare) <= 4096) return { json: bare, short: true };
    return { json: fitShort(raw), short: true };
  }

  function showSummary(json, short) {
    var dlg = document.getElementById('summary');
    var pretty = json;
    try { pretty = JSON.stringify(JSON.parse(json), null, 2); } catch (e) {}
    document.getElementById('summary-json').textContent = pretty;
    document.getElementById('summary-size').textContent = utf8len(json) + ' octets';
    document.getElementById('summary-note').hidden = !short;
    document.getElementById('summary-copy').textContent = 'Copier';
    try {
      if (typeof dlg.showModal === 'function') {
        if (!dlg.open) dlg.showModal();
      } else {
        dlg.setAttribute('open', '');
      }
    } catch (e) {
      dlg.setAttribute('open', '');
    }
  }

  function canSend(webApp) {
    if (!webApp || typeof webApp.sendData !== 'function') return false;
    if (!webApp.platform || webApp.platform === 'unknown') return false;
    if (typeof webApp.initData !== 'string' || !webApp.initData) return false;
    return true;
  }

  function onFinish() {
    if (lastJson) {
      if (!canSend(tg)) showSummary(lastJson, lastShort);
      return;
    }
    var encoded = encodePayload(buildRaw());
    lastJson = encoded.json;
    lastShort = encoded.short;
    sealed = true;
    restRunning = false;
    restUntil = 0;
    clearTimeout(hideTimer);
    if (restTick) clearInterval(restTick);
    storageDel(storageKey);
    hideRest();
    if (canSend(tg)) {
      try {
        tg.sendData(lastJson);
        return;
      } catch (e) {
        showSummary(lastJson, lastShort);
        return;
      }
    }
    showSummary(lastJson, lastShort);
  }

  async function copySummary() {
    if (!lastJson) return;
    var btn = document.getElementById('summary-copy');
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(lastJson);
        btn.textContent = 'Copié';
        return;
      }
    } catch (e) {}
    try {
      var ta = document.createElement('textarea');
      ta.value = lastJson;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      ta.remove();
      btn.textContent = ok ? 'Copié' : 'Copie impossible';
    } catch (e) {
      btn.textContent = 'Copie impossible';
    }
  }

  function hapticSuccess() {
    var h = tg && tg.HapticFeedback;
    if (!h) return;
    try {
      if (typeof h.notificationOccurred === 'function') h.notificationOccurred('success');
      else if (typeof h.impactOccurred === 'function') h.impactOccurred('heavy');
    } catch (e) {}
  }

  function primeAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended' && audioCtx.resume) audioCtx.resume();
    } catch (e) {}
  }

  function beep() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      var ctx = audioCtx;
      var play = function () {
        tone(ctx, 880, 0, 0.22);
        tone(ctx, 1175, 0.16, 0.38);
      };
      if (ctx.state === 'suspended' && ctx.resume) {
        var pending = ctx.resume();
        if (pending && typeof pending.then === 'function') pending.then(play).catch(function () {});
        else play();
      } else {
        play();
      }
    } catch (e) {}
  }

  function tone(ctx, freq, start, stop) {
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = freq;
    o.connect(g);
    g.connect(ctx.destination);
    var t = ctx.currentTime + start;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + stop);
    o.start(t);
    o.stop(ctx.currentTime + stop + 0.02);
  }

  function announce(text) {
    var live = document.getElementById('live');
    live.textContent = '';
    setTimeout(function () { live.textContent = text; }, 30);
  }

  function isLight(hex) {
    if (typeof hex !== 'string') return false;
    var c = hex.trim().replace('#', '');
    if (c.length === 3) c = c.replace(/./g, function (ch) { return ch + ch; });
    if (!/^[0-9a-fA-F]{6}/.test(c)) return false;
    var r = parseInt(c.slice(0, 2), 16);
    var g = parseInt(c.slice(2, 4), 16);
    var b = parseInt(c.slice(4, 6), 16);
    return (0.2126 * r + 0.7152 * g + 0.0722 * b) > 160;
  }

  function applyTheme(webApp) {
    var p = (webApp && webApp.themeParams) || {};
    var root = document.documentElement;
    var pairs = [
      ['--bg', p.bg_color],
      ['--text', p.text_color],
      ['--hint', p.hint_color],
      ['--link', p.link_color],
      ['--btn', p.button_color],
      ['--btn-text', p.button_text_color],
      ['--secondary', p.secondary_bg_color],
      ['--header', p.header_bg_color || p.bg_color],
      ['--section', p.section_bg_color || p.secondary_bg_color],
      ['--accent', p.accent_text_color || p.button_color],
      ['--destructive', p.destructive_text_color]
    ];
    for (var i = 0; i < pairs.length; i++) {
      var value = pairs[i][1];
      if (typeof value === 'string' && value.trim()) root.style.setProperty(pairs[i][0], value);
    }
    if (typeof p.bg_color === 'string' && p.bg_color) {
      root.style.colorScheme = isLight(p.bg_color) ? 'light' : 'dark';
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', p.bg_color);
    }
    if (webApp && typeof webApp.setHeaderColor === 'function' && p.bg_color) {
      try { webApp.setHeaderColor(p.bg_color); } catch (e) {}
    }
    if (webApp && typeof webApp.setBackgroundColor === 'function' && p.bg_color) {
      try { webApp.setBackgroundColor(p.bg_color); } catch (e) {}
    }
  }

  function setupMainButton(webApp) {
    var mb = webApp && webApp.MainButton;
    if (!mb) return;
    var text = '🏁 Terminer';
    try {
      if (typeof mb.setText === 'function') mb.setText(text);
      else mb.text = text;
    } catch (e) {}
    try {
      if (typeof mb.onClick === 'function') mb.onClick(onFinish);
    } catch (e) {}
    try {
      if (pColor(webApp) && typeof mb.setParams === 'function') {
        mb.setParams({
          text: text,
          color: webApp.themeParams.button_color,
          text_color: webApp.themeParams.button_text_color,
          is_visible: true
        });
      }
    } catch (e) {}
    try {
      if (typeof mb.show === 'function') mb.show();
    } catch (e) {}
  }

  function pColor(webApp) {
    return webApp.themeParams && webApp.themeParams.button_color;
  }

  document.addEventListener('pointerup', function () {
    if (!armClickSwallow) return;
    armClickSwallow = false;
    swallowClick = true;
    setTimeout(function () { swallowClick = false; }, 0);
  }, true);

  document.addEventListener('pointercancel', function () {
    armClickSwallow = false;
  }, true);

  document.addEventListener('click', function (e) {
    if (!swallowClick) return;
    swallowClick = false;
    e.preventDefault();
    e.stopPropagation();
  }, true);

  list.addEventListener('click', function (e) {
    var saveBtn = e.target.closest('[data-action="save-edit"]');
    if (saveBtn) { commitEdit(); return; }
    var cancelBtn = e.target.closest('[data-action="cancel-edit"]');
    if (cancelBtn) { editAt = null; renderExercises(); return; }
    var editBtn = e.target.closest('.edit');
    if (editBtn) {
      openEdit(Number(editBtn.dataset.i), Number(editBtn.dataset.s));
      return;
    }
    var setBtn = e.target.closest('.set');
    if (!setBtn) return;
    toggleSet(Number(setBtn.dataset.i), Number(setBtn.dataset.s));
  });

  list.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.closest('#editor')) {
      e.preventDefault();
      commitEdit();
    } else if (e.key === 'Escape' && editAt) {
      editAt = null;
      renderExercises();
    }
  });

  var pressTimer = 0;
  list.addEventListener('pointerdown', function (e) {
    var setBtn = e.target.closest('.set');
    if (!setBtn || e.button > 0) return;
    var i = Number(setBtn.dataset.i);
    var s = Number(setBtn.dataset.s);
    var x = e.clientX;
    var y = e.clientY;
    clearTimeout(pressTimer);
    pressTimer = setTimeout(function () {
      armClickSwallow = true;
      openEdit(i, s);
    }, 450);
    function cancel() { clearTimeout(pressTimer); detach(); }
    function move(ev) {
      if (Math.hypot(ev.clientX - x, ev.clientY - y) > 12) cancel();
    }
    function detach() {
      setBtn.removeEventListener('pointermove', move);
      setBtn.removeEventListener('pointerup', cancel);
      setBtn.removeEventListener('pointercancel', cancel);
    }
    setBtn.addEventListener('pointermove', move);
    setBtn.addEventListener('pointerup', cancel);
    setBtn.addEventListener('pointercancel', cancel);
  });

  list.addEventListener('contextmenu', function (e) {
    if (e.target.closest('.set') || e.target.closest('.edit')) e.preventDefault();
  });

  finishBtn.addEventListener('click', onFinish);
  document.getElementById('rest-plus').addEventListener('click', function () { adjustRest(15000); });
  document.getElementById('rest-minus').addEventListener('click', function () { adjustRest(-15000); });
  document.getElementById('rest-skip').addEventListener('click', skipRest);
  document.getElementById('summary-copy').addEventListener('click', function () { copySummary(); });
  document.getElementById('summary-close').addEventListener('click', function () {
    var dlg = document.getElementById('summary');
    if (typeof dlg.close === 'function' && dlg.open) dlg.close();
    else dlg.removeAttribute('open');
  });

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    tickClock();
    if (restRunning) tickRest();
  });

  restore();
  renderAll();
  tickClock();
  setInterval(tickClock, 250);
  if (restRunning && !restTick) restTick = setInterval(tickRest, 200);
  save();

  if (tg) {
    try { if (typeof tg.ready === 'function') tg.ready(); } catch (e) {}
    try { if (typeof tg.expand === 'function') tg.expand(); } catch (e) {}
    applyTheme(tg);
    try {
      if (typeof tg.onEvent === 'function') tg.onEvent('themeChanged', function () { applyTheme(tg); });
    } catch (e) {}
    setupMainButton(tg);
  }
})();
  </script>
</body>
</html>
